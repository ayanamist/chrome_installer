name: Archive Chrome releases

on:
  schedule:
    # 04:31 Asia/Singapore (UTC+8), every day.
    - cron: '31 20 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/archive.yml'
      - 'scripts/**'
      - 'tests/**'
  pull_request:
    paths:
      - '.github/workflows/archive.yml'
      - 'scripts/**'
      - 'tests/**'

permissions:
  contents: read

concurrency:
  group: chrome-archive-${{ github.ref }}
  cancel-in-progress: false

jobs:
  archive:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {platform: windows, arch: x86}
          - {platform: windows, arch: x64}
          - {platform: windows, arch: arm64}
          - {platform: macos, arch: x64}
          - {platform: macos, arch: arm64}
          - {platform: linux, arch: x64}
          - {platform: linux, arch: arm64}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Check archive and release logic
        run: python -m unittest discover -s tests -v
      - name: Set up 7-Zip
        if: github.event_name != 'pull_request'
        id: sevenzip
        run: python scripts/setup_7zip.py
      - name: Download, verify and repack official payloads
        if: github.event_name != 'pull_request'
        id: archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python scripts/chrome_archive.py
          --platform ${{ matrix.platform }} --arch ${{ matrix.arch }}
          --seven-zip "${{ steps.sevenzip.outputs.command }}" --output dist
      - uses: actions/upload-artifact@v7
        if: steps.archive.outputs.has_discovery == 'true'
        with:
          name: chrome-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  publish:
    needs: archive
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          # The token is reused to push the README update below.
          persist-credentials: ${{ github.ref == 'refs/heads/main' }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v8
        with:
          pattern: chrome-*
          path: dist/
          merge-multiple: true
      - name: Publish archives and refresh currently offered versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/publish_releases.py --input dist
      - name: Update README release links
        if: github.ref == 'refs/heads/main'
        run: |
          python scripts/update_readme.py --input dist
          if git diff --quiet -- README.md; then
            echo 'README release links are up to date.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git commit -m 'Update README release links [skip ci]'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
